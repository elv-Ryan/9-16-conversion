      group_crop_width_factor: 1.05
      min_motion_score: 0.10
    temporal:
      min_hold_seconds: 0.85
      lost_hold_seconds: 0.55
      switch_margin: 0.17
      deadband: 0.005
      response_time_seconds: 0.44
      max_speed_normalized_per_second: 0.21
      max_acceleration_normalized_per_second2: 0.58
    local_shots:
      histogram_threshold: 0.48
      minimum_shot_seconds: 0.24

output:
  vertical_track: vertical_video
  focus_track: focus
  bbox_track: focus_bbox
  coordinate_decimals: 6
  max_boxes_per_shot: 3
